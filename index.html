<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      viewport-fit=cover lets content extend into the notch/Dynamic Island area.
      We then use env(safe-area-inset-*) in CSS to pad away from hardware edges.
    -->
    <!--
      user-scalable=no was removed: it blocks pinch-zoom entirely, which fails
      WCAG 1.4.4. iOS auto-zoom on input focus is prevented properly instead, by
      keeping every focusable input at font-size >= 16px (see the
      @supports (-webkit-touch-callout: none) blocks in the SCSS modules).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      iOS PWA standalone mode.
      IMPORTANT: user must DELETE the old shortcut and re-add from Share → Add to Home Screen
      after these tags are deployed — iOS caches install metadata per URL.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      black-translucent: status bar text adapts to background, content renders edge-to-edge.
      The header already pads env(safe-area-inset-top) so nothing is clipped.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance24" />

    <!-- Home screen icon — iOS requires PNG (SVG is ignored) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Android PWA / browser chrome colour. These match --bg in each theme so the
      toolbar blends into the app header instead of showing a contrasting band.
      ThemeContext keeps the active tag in sync when the user toggles the theme.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0F1117" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Start the font handshake in parallel with the CSS bundle, not after it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <title>Finance24</title>

    <!--
      Two things that must happen BEFORE first paint:

      1. The stored theme. React sets this class in an effect, which runs after
         paint — dark-mode users saw a white flash on every launch.
      2. --app-h, the real visible viewport height. index.css sizes <html> from
         it; seeding it here means the var() always resolves, so the shell is
         never painted at the wrong height and never falls back to a bare
         height:auto on an engine without dvh. src/lib/viewport.ts keeps it
         current from there on.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ft-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add('theme-' + t);
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
        try {
          var vv = window.visualViewport;
          var h = (vv && vv.scale === 1 ? vv.height : 0) || window.innerHeight;
          if (h > 0) {
            document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
          }
        } catch (e) { /* CSS falls back to 100dvh */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
