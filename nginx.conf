server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Entry points: never serve these from a stale HTTP cache.
    #
    # The previous config set no Cache-Control at all, so browsers fell back
    # to heuristic freshness (RFC 9111 §4.2.2) — roughly 10% of the age since
    # Last-Modified, which for files baked into a Docker image is the build
    # time. An installed PWA then keeps booting an old index.html, which names
    # old hashed bundles, and never sees a new service worker. Source fixes
    # ship and never arrive on the device: this is why three separate layout
    # fixes appeared to change nothing on the phone.
    # ------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # no-store as well as no-cache: a CDN in front of this (Cloudflare and the
    # like) will otherwise hold its own copy and keep handing out the old
    # worker, which defeats registerType: autoUpdate entirely.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
        access_log off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        # Not in nginx's default mime.types, so it went out as
        # application/octet-stream.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # ------------------------------------------------------------------
    # Hashed bundles. The filename changes every build, so they can be cached
    # forever — and a MISSING one must 404 rather than fall through to the SPA
    # rule below. Returning index.html with a 200 for a deleted
    # /assets/index-OLD.js makes the browser parse HTML as JavaScript, which
    # fails in a way that looks nothing like a caching problem.
    # ------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback, for real navigations only.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # nginx maps .js to application/javascript before 1.21.5 and to
    # text/javascript from 1.21.5 onward. The old list named only the former,
    # so on a current nginx:alpine the main bundle shipped uncompressed —
    # ~800 kB instead of ~245 kB, over mobile data, on every cold install.
    # Both are listed so the nginx version stops mattering.
    # text/html is always gzipped and must not appear here.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
}
